services:
  db:
    image: postgres:16-alpine
    container_name: gestion_entreprise_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: gestion_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d gestion_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


