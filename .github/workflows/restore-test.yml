name: Test de restauration

# ACC-07 / SEC-06 : une sauvegarde ne vaut que si elle se restaure.
# Chaque semaine, et à chaque changement des scripts ou du schéma, on sauvegarde une base de test,
# on la restaure dans une base vierge et on compare le contenu et l'isolation.
# Un échec planifié notifie le propriétaire du dépôt.

on:
  schedule:
    - cron: "17 3 * * 1" # lundi 03:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/restore-test.yml"

permissions:
  contents: read

concurrency:
  group: restore-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    name: Sauvegarde puis restauration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Même version majeure que docker-compose.yml et que le client pg_dump du runner
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mot-de-passe-ci-fictif # serveur jetable du job, sans donnée réelle
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Test de bout en bout
        env:
          ADMIN_URL: postgresql://postgres:mot-de-passe-ci-fictif@localhost:5432/postgres
        run: ./scripts/test-restore.sh
