name: Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou SHA à déployer en Preview (ses contrôles CI doivent être verts)"
        required: true
        default: main
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: polygest-vercel-deploy
  cancel-in-progress: false

jobs:
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout du commit poussé sur main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Attendre et vérifier la réussite de la CI sur ce commit exact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100")"
            state="$(jq -r '
              [.check_runs[]
                | select(.app.slug == "github-actions")
                | select(.name == "Web — lint, types, tests, build" or .name == "Scripts shell — shellcheck")]
              | if length != 2 then "pending"
                elif any(.[]; .conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") then "failure"
                elif all(.[]; .status == "completed" and .conclusion == "success") then "success"
                else "pending" end
            ' <<< "$checks")"

            if [[ "$state" == "success" ]]; then
              echo "Les deux jobs CI sont verts pour ${sha}."
              exit 0
            fi
            if [[ "$state" == "failure" ]]; then
              echo "::error::La CI a échoué pour ${sha}. Déploiement bloqué."
              exit 1
            fi
            echo "CI en attente pour ${sha} (tentative ${attempt}/30)."
            sleep 30
          done
          echo "::error::Délai dépassé : la CI n'a pas confirmé les deux jobs pour ${sha}."
          exit 1

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      - name: Installer Vercel CLI (version figée)
        run: npm install --global vercel@65.11.0

      - name: Déployer en production
        run: vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    steps:
      - name: Checkout de la référence demandée
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Vérifier les contrôles CI du commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          checks_ok="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" --jq '[.check_runs[] | select(.app.slug == "github-actions")] | if length == 0 then false else all(.[]; .status == "completed" and .conclusion == "success") end')"
          if [[ "$checks_ok" != "true" ]]; then
            echo "::error::Les contrôles GitHub Actions du commit ${sha} ne sont pas tous terminés avec succès."
            exit 1
          fi
          echo "Tous les contrôles GitHub Actions sont verts pour ${sha}."

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      - name: Installer Vercel CLI (version figée)
        run: npm install --global vercel@65.11.0

      - name: Déployer une Preview
        run: vercel deploy --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
