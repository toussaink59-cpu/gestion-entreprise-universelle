name: Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou SHA à déployer en Preview (ses contrôles CI doivent être verts)"
        required: true
        default: main
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: polygest-vercel-deploy
  cancel-in-progress: false

jobs:
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout du commit poussé sur main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Attendre les contrôles requis sur ce commit exact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "::error::Impossible de déterminer les fichiers modifiés du commit ${sha}."
            exit 1
          fi
          changed_files="$(git diff --name-only HEAD^ HEAD)"
          required_checks=(
            "Web — lint, types, tests, build"
            "Scripts shell — shellcheck"
          )
          if grep -Eq '^(supabase/|apps/web/__tests__/db/|apps/web/package\.json$|apps/web/package-lock\.json$|\.github/workflows/supabase-reel\.yml$)' <<< "${changed_files}"; then
            required_checks+=("Migrations, lint SQL et tests sur Supabase local")
          fi
          if grep -Eq '^(scripts/|supabase/|\.github/workflows/restore-test\.yml$)' <<< "${changed_files}"; then
            required_checks+=("Sauvegarde puis restauration")
          fi
          for attempt in $(seq 1 30); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100")"
            state="success"
            for required_check in "${required_checks[@]}"; do
              check_state="$(jq -r --arg name "$required_check" '
                [.check_runs[]
                  | select(.app.slug == "github-actions")
                  | select(.name == $name)]
                | sort_by(.started_at // .created_at)
                | if length == 0 then "pending"
                  else .[-1]
                    | if .status != "completed" then "pending"
                      elif .conclusion == "success" then "success"
                      else "failure" end
                  end
              ' <<< "$checks")"
              if [[ "$check_state" == "failure" ]]; then
                echo "::error::Le contrôle requis '${required_check}' a échoué pour ${sha}."
                state="failure"
                break
              fi
              if [[ "$check_state" != "success" ]]; then
                state="pending"
              fi
            done
            if [[ "$state" == "success" ]]; then
              echo "Tous les contrôles requis sont verts pour ${sha}: ${required_checks[*]}"
              exit 0
            fi
            if [[ "$state" == "failure" ]]; then
              exit 1
            fi
            echo "Contrôles requis en attente pour ${sha} (tentative ${attempt}/30): ${required_checks[*]}"
            sleep 30
          done
          echo "::error::Délai dépassé : les contrôles requis ne sont pas tous verts pour ${sha}."
          exit 1

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Installer Vercel CLI (version figée)
        run: npm install --global vercel@65.11.0

      - name: Déployer en production
        run: vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Vérifier les en-têtes HTTP après déploiement
        run: scripts/check-security-headers.sh https://polygest.vercel.app

  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    steps:
      - name: Checkout de la référence demandée
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Vérifier les contrôles CI du commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          checks_ok="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" --jq '[.check_runs[] | select(.app.slug == "github-actions")] | if length == 0 then false else all(.[]; .status == "completed" and .conclusion == "success") end')"
          if [[ "$checks_ok" != "true" ]]; then
            echo "::error::Les contrôles GitHub Actions du commit ${sha} ne sont pas tous terminés avec succès."
            exit 1
          fi
          echo "Tous les contrôles GitHub Actions sont verts pour ${sha}."

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Installer Vercel CLI (version figée)
        run: npm install --global vercel@65.11.0

      - name: Déployer une Preview
        run: vercel deploy --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
