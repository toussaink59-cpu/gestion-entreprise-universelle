name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, types, tests, build
    # Version figée : « ubuntu-latest » change de version sans prévenir (Ubuntu 26 dès le 19/10/2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      # Le build génère next-env.d.ts (ignoré par Git) : il précède la vérification des types.
      - name: Build
        run: npm run build

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  scripts:
    name: Scripts shell — shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: shellcheck
        run: shellcheck scripts/*.sh
